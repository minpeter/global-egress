# Minimal compose stack for global-egress.
#
# Prerequisites (in this directory, or override with env / compose overrides):
#   config.toml          from config.example.toml
#   proxy-password       single-line shared secret for proxy clients
#   control-token        single-line control API bearer token; required because
#                        config.example.toml sets access.control_token_file, and
#                        the health check authenticates with the same file
#   catalog/             provider .conf files, or a .zip
#
#   docker compose -f deploy/docker/docker-compose.yml up -d
#
# No NET_ADMIN, no /dev/net/tun, no privileged mode.

name: global-egress

services:
  global-egress:
    image: ${GLOBAL_EGRESS_IMAGE:-ghcr.io/minpeter/global-egress:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    # Hundreds of tunnels mean hundreds of UDP sockets plus client connections.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Publish only on the host loopback by default. Point clients at the LAN
    # address (or drop the 127.0.0.1 prefix) once access.allowed_clients is set.
    ports:
      - "127.0.0.1:1080:1080" # SOCKS5
      - "127.0.0.1:3128:3128" # HTTP CONNECT
      - "127.0.0.1:8080:8080" # control + /v1/metrics
    volumes:
      - ./config.toml:/etc/global-egress/config.toml:ro
      - ./proxy-password:/etc/global-egress/proxy-password:ro
      - ./control-token:/etc/global-egress/control-token:ro
      - ./catalog:/catalog:ro
      - state:/var/lib/global-egress
    # The image has no shell, so the binary probes its own control API. Exec form
    # is required: there is no /bin/sh to expand a string.
    #
    # -token-file matches access.control_token_file in config.example.toml. A
    # configured control token is checked on every control request including
    # GET /healthz, so an unauthenticated probe gets 401 and would report a
    # healthy container as unhealthy. Reading the token from the mounted file
    # keeps it out of the image, this file, and `docker inspect`.
    #
    # Drop both this flag and the ./control-token mount if you remove
    # access.control_token_file from config.toml.
    healthcheck:
      test:
        ["CMD", "/usr/local/bin/global-egress", "healthcheck",
         "-token-file", "/etc/global-egress/control-token"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Optional memory headroom for ~25 open userspace tunnels (~1.6 MiB each).
    mem_limit: 1g

volumes:
  state:
