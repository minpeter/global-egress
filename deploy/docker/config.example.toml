# Container example. Copy to config.toml and replace the placeholder paths/secrets.
mode = "relay-socks"
state_dir = "/var/lib/global-egress"

[listen]
socks5 = "0.0.0.0:1080"
http = "0.0.0.0:3128"
control = "0.0.0.0:8080"

[access]
allowed_clients = ["172.16.0.0/12"]
password_file = "/etc/global-egress/proxy-password"
require_auth = true
require_policy = true
# Required for mutating control requests from outside the container.
control_token_file = "/etc/global-egress/control-token"

[[providers]]
id = "mullvad"
type = "mullvad"
enabled = true

[providers.catalog]
path = "/catalog/wireguard"

[providers.relays]
url = "https://api.mullvad.net/www/relays/wireguard/"
cache = "relays.json"
refresh = "24h"

[providers.entries]
auto = 2

