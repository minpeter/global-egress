# Tegami on main (version PR / tag + GitHub Release notes), then side artifacts.
#
#   .tegami/*.md → Version Packages PR → merge → vX.Y.Z tag + Release
#                                         ↓
#                    binaries (+ .sha256) uploaded to that Release
#                    multi-arch image pushed only after binaries succeed
#
# workflow_dispatch pushes an "edge" image only (no version / no Release).

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Version Packages PR, or on merge of that PR: git tag + GitHub Release body.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Version & release
        run: node scripts/tegami.mts ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Newest v* tag on HEAD (tegami just created it on a publish run).
      - name: Detect released tag
        id: tag
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Released: $tag"
          else
            echo "No release tag on HEAD; skipping binary and image jobs."
          fi

  # Static binaries for bare-metal / LXC. Each matrix leg attaches the binary and
  # its .sha256 (no separate checksums job — that only duplicated failure modes).
  binaries:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="global-egress-${GOOS}-${GOARCH}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-X main.version=${TAG} -s -w" \
            -o "dist/${name}" ./cmd/global-egress
          (cd dist && sha256sum "${name}" > "${name}.sha256")

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/* --clobber

  # Multi-arch image only after binaries are on the Release (one version, one set).
  image:
    needs: [release, binaries]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image name (GHCR requires lowercase)
        id: meta
        run: |
          echo "image=${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ env.TAG }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VERSION=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual smoke: multi-arch "edge" image, no GitHub Release.
  edge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image name (GHCR requires lowercase)
        id: meta
        run: |
          echo "image=${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:edge
          build-args: |
            VERSION=edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
